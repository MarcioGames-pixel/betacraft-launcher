name: Android v1 port

on:
  push:
    branches: [ android-v1-port ]
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'
  pull_request:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p android-port :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: betacraft-android-v1-debug
          path: android-port/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
