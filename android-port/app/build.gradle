plugins {
    id 'com.android.application'
}

android {
    namespace 'org.betacraft.launcher.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.betacraft.launcher.android'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0-android-v1-port'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
