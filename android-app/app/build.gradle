plugins {
    id 'com.android.application'
}

def legacyAppletSource = file('src/appletHost/java/com/marciogames/betacraft/runtime/LegacyAppletMain.java')
def legacyAppletClasses = layout.buildDirectory.dir('generated/legacy-applet/classes')
def legacyAppletAssets = layout.buildDirectory.dir('generated/legacy-applet/assets')

tasks.register('compileLegacyAppletHost', JavaCompile) {
    source files(legacyAppletSource)
    classpath = files()
    destinationDirectory = legacyAppletClasses
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('packageLegacyAppletHost', Jar) {
    dependsOn tasks.named('compileLegacyAppletHost')
    archiveFileName = 'legacy-applet-host.jar'
    destinationDirectory = legacyAppletAssets.map { it.dir('legacy-applet') }
    from legacyAppletClasses
}

android {
    namespace 'com.marciogames.betacraft.android'
    compileSdk 35

    sourceSets {
        main {
            assets.srcDir(legacyAppletAssets)
        }
    }

    defaultConfig {
        applicationId 'com.marciogames.betacraft.android'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion '27.2.12479018'

    // The pinned lwjgl2-glfw build supplies libglfw.so alongside liblwjgl64.so
    // and libjawt.so. Keep one packaged copy per ABI if a transitive native
    // dependency happens to contribute a same-named library.
    packaging {
        jniLibs {
            // LWJGL 2 and the embedded JVM locate native libraries through
            // java.library.path and ApplicationInfo.nativeLibraryDir. Newer
            // AGP defaults can leave JNI libraries unextracted in the APK,
            // making filesystem checks fail even when the ZIP contains them.
            useLegacyPackaging = true
            pickFirsts += [
                'lib/arm64-v8a/libglfw.so',
                'lib/armeabi-v7a/libglfw.so',
                'lib/x86/libglfw.so',
                'lib/x86_64/libglfw.so'
            ]
        }
    }


    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'

    testImplementation 'junit:junit:4.13.2'
}

// Make the JVM-side applet host available as a normal JAR in the APK assets.
tasks.named('preBuild').configure {
    dependsOn tasks.named('packageLegacyAppletHost')
}
